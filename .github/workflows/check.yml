name: Build and check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: python scripts/build.py
      - run: python previews/side-stage/build.py
      - run: node tests/seed18-review.cjs
      - run: node tests/seed18-preview-smoke.cjs
      - run: node tests/check.cjs
      - run: node tests/determinism.cjs
      - run: node tests/presentation-weather.cjs
      - run: node tests/race-manifest.cjs
      - run: node tests/ordinary-timeline.cjs
      - run: node tests/side-stage.cjs
      - run: node tests/race-director-first-flight.cjs
      - run: node tests/bodge.cjs
      - run: node tests/recovery-stress.cjs
      - run: node tests/bounty.cjs
      - run: node tests/bounty-new-contracts.cjs
      - run: node tests/witness-bounties.cjs
      - run: node tests/choice-bounty-recalculation.cjs
      - run: node tests/encyclopaedia.cjs
      - run: node tests/encyclopaedia-recovery.cjs
      - run: node tests/archive-run-identity.cjs
      - run: node tests/encyclopaedia-stages.cjs
      - run: node tests/dialogue-ui.cjs
      - run: node tests/three-garage.cjs
      - run: node tests/event-content-audit.cjs
      - run: node tests/gag-buildability.cjs
      - run: node tests/gag-perks.cjs
      - run: node tests/pass-event-audit.cjs
      - run: node tests/bounty-goals.cjs
      - run: node tests/bounty-balance.cjs
      - run: node tests/bounty-result-browser.cjs
      - run: node tests/smoke.cjs
      - run: node scripts/economy-playthrough.cjs --quick
