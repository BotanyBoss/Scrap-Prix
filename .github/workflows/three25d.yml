name: Test isolated Three.js 2.5D scene
on:
  push:
    branches: [prototype/threejs-25d]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render real 3D scene in headless Chromium
        run: node lab/three25d/smoke.cjs
      - name: Save browser frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrap-prix-threejs-lab-browser-frame
          path: lab/three25d/lab-browser-proof.png
          if-no-files-found: ignore
