name: Capture Scrap Prix race dialogue concept
on:
  push:
    branches: [prototype/race-subtitles-screenshot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/build.py
      - name: Capture real race event and dialogue HUD in Chromium
        run: node prototypes/race-subtitles/capture.cjs
      - name: Upload real race screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrap-prix-race-subtitle-screenshot
          path: prototypes/race-subtitles/race-screen-with-subtitles.png
          if-no-files-found: warn
