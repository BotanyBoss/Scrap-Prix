name: Street tyre workshop test
on:
  push:
    branches:
      - art/street-tyre-workshop-test
  workflow_dispatch:
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone game and previews
        run: python3 scripts/build.py
      - name: Run existing regression checks
        run: node tests/check.cjs
      - name: Confirm workshop is embedded in preview
        shell: bash
        run: |
          test -f dist/STREET-PREVIEW.html
          grep -q 'streetWorkshopTest' dist/STREET-PREVIEW.html
          grep -q 'data:image/png;base64' dist/STREET-PREVIEW.html
      - name: Package playable files
        uses: actions/upload-artifact@v4
        with:
          name: scrap-prix-street-tyre-workshop-test
          path: |
            dist/index.html
            dist/dev.html
            dist/STREET-PREVIEW.html
          retention-days: 14
