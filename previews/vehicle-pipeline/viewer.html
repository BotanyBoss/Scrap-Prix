<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Scrap Prix · Vehicle pipeline</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141f24;color:#efe5cf;font:15px system-ui}main{max-width:1120px;margin:auto;padding:16px}h1{font-size:28px;margin:0}p{margin:5px 0 12px;color:#bbcbc7}fieldset,article{border:1px solid #45585c;border-radius:5px;background:#203137;padding:10px;margin:0}fieldset,.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{font-size:13px}select,button,a{font:inherit;color:#ffe6b4;background:#283c40;border:1px solid #788683;border-radius:3px;padding:5px}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin:10px 0}h2{font-size:16px;margin:0 0 6px}.stage{position:relative;background:radial-gradient(ellipse at bottom,#60706b,#263b40);border:1px solid #526664}.stage canvas{display:block;width:100%;touch-action:none}.stage #overlay{position:absolute;inset:0;pointer-events:none}.pair{display:grid;grid-template-columns:1fr 1fr;gap:5px}.pair canvas{width:100%;image-rendering:pixelated;background:#34474b}.metrics{font:13px/1.6 monospace;color:#cfddd5}button{cursor:pointer}output{display:block}a{display:inline-block;margin-top:10px}input{accent-color:#ffc768}@media(max-width:720px){.grid{grid-template-columns:1fr}main{padding:8px}}
</style><main><h1>Modular vehicle pipeline</h1><p>Temporary geometry · Salvaged GT, Needle and Longbody mounting study</p>
<fieldset id="loadout"><legend>Equipment</legend></fieldset><div class="grid"><article><h2>Garage inspection</h2><div class="stage"><canvas id="garage" width="492" height="339"></canvas><canvas id="overlay" width="492" height="339"></canvas></div><div class="controls"><label>Orbit <input id="orbit" type="range" min="-180" max="180" value="47"></label><label>Elevation <input id="pitch" type="range" min="-5" max="80" value="18"></label><label><input id="sockets" type="checkbox"> Show sockets</label></div><p id="layout"></p></article>
<article><h2>Race frame comparison</h2><div class="controls"><label>View <select id="view"><option value="front">Front three-quarter</option><option value="side">Side</option><option value="rear">Rear three-quarter</option></select></label><label>Wear preview <select id="wear"><option value="">Clean</option></select></label></div><div class="pair"><div><h3>3D capture</h3><canvas id="capture" width="164" height="113"></canvas></div><div><h3>Game raster</h3><canvas id="raster" width="164" height="113"></canvas></div></div><button id="export">Save transparent 3D frame</button> <button id="export2">Save raster frame</button><p>164 × 113 px · pivot at (82, 84)</p><output class="metrics" id="metrics"></output></article></div><p id="error" role="alert"></p></main><!-- modules --></html>
