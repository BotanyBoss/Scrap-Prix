<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scrap Prix • First Flight</title><style>
*{box-sizing:border-box}body{margin:0;color:#ece6d2;background:#111c20;font:15px system-ui,sans-serif}main{max-width:1070px;margin:auto;padding:24px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}small,.tag,dt{font:700 11px monospace;letter-spacing:.12em;color:#adc0bd;text-transform:uppercase}h1{font:italic 900 clamp(26px,5vw,44px) system-ui;margin:3px 0 16px;color:#ffc968;letter-spacing:-.04em}section{display:grid;grid-template-columns:minmax(0,2.55fr) minmax(200px,1fr);gap:15px}article,aside{background:#203034;border:1px solid #47585b;border-radius:5px;padding:12px}canvas{width:100%;aspect-ratio:16/9;display:block;background:#142326;image-rendering:pixelated}button,select{font:700 14px system-ui;border:1px solid #839995;border-radius:3px;color:inherit;background:#284246;padding:7px 11px;cursor:pointer}button:disabled{opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffcd70}#choice{padding:10px;background:#141f24;border-left:4px solid #ffbf59}#choice p{margin:0 0 8px}#choice button{background:#ffcb6f;color:#272721}input[type=range]{width:100%;accent-color:#ffb74d}footer,.caption{margin-top:12px}.caption{font:700 13px monospace;color:#f4cc87}dl{margin:12px 0}dd{margin:3px 0 12px}#facts{white-space:pre-line;font-variant-numeric:tabular-nums}#clock{font:14px monospace}label{font-size:13px}@media(max-width:720px){section{display:block}aside{margin-top:12px}main{padding:10px}}body.native canvas{width:min(480px,100%);margin:auto}
</style><main><header><div><small>SCRAP PRIX &nbsp;/&nbsp; RACE DIRECTOR &nbsp;/&nbsp; 01</small><h1>Broken Bridge Jump</h1></div><label>Starting garage <select id="seed"><option value="76">76 · Street</option><option value="385">385 · Rally</option></select></label></header>
<section><article><canvas id="film" width="480" height="270" aria-label="Animated race camera"></canvas>
<div class="caption row"><span id="shot"></span><output id="clock"></output></div>
<input type="range" id="seek" aria-label="Seek excerpt" min="0" max="24300" step="1" value="0">
<div id="choice" hidden><p id="prompt"></p><button id="safe"></button> <button id="risk"></button></div>
<footer class="row"><button id="play">Pause</button><button id="restart">Restart</button><button id="skip">Skip</button><select id="speed" aria-label="Playback speed"><option>1x</option><option>2x</option><option>3x</option><option>4x</option></select><label><input id="reduce" type="checkbox"> Reduced motion</label><label><input id="native" type="checkbox"> Native size</label></footer></article>
<aside><small>Race telemetry</small><dl><dt>Fixture source</dt><dd id="source"></dd><dt>Equipped assembly</dt><dd id="parts"></dd><dt>Bridge report</dt><dd id="facts" aria-live="polite"></dd></dl></aside></section></main><!-- modules --></html>
