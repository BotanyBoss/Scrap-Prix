<style>#env-depth-test{position:fixed;inset:0;z-index:999999;background:#14272e;color:#f3e7c7;padding:20px;overflow:auto;font:16px system-ui}#env-depth-test h1{margin:0 0 12px}#env-depth-test select,#env-depth-test button{padding:8px;margin:4px}#env-depth-test canvas{display:block;width:480px;height:270px;image-rendering:pixelated;margin-top:15px}#env-depth-test canvas.large{width:960px;height:540px}#env-depth-test pre{white-space:pre-wrap;font-size:13px}</style><section id="env-depth-test"><h1>Environment colour and shading preview</h1><p>Backgrounds at native game size. Your campaign save is not changed.</p><label>Environment <select id="ed-env"></select></label><label>Weather <select id="ed-weather"><option value="clear">Clear</option><option value="rain">Rain</option><option value="fog">Fog</option><option value="blizzard">Blizzard</option></select></label><button id="ed-pause">Pause motion</button><label><input type="checkbox" id="ed-large">2x inspection</label><canvas id="ed-canvas"></canvas><p id="ed-status">Loading...</p><button id="ed-smoke">Check all environment/weather combinations</button><pre id="ed-results"></pre></section><script>(async()=>{const $=id=>document.getElementById('ed-'+id),recipes=Object.entries(ScrapEnvironments.RECIPES);for(const [id,r]of recipes){const o=document.createElement('option');o.value=id;o.textContent=r.name;$('env').append(o);}const c=$('canvas'),scene=ScrapScene.create(c,{style:'chunky',camera:'rear'});await scene.ready;let t=1900,last=0,paused=false;const models={chassis:'gt',engine:'motor',tyres:'road',gadget:'deskfan'};function draw(){scene.drawRace({time:t,models,motion:true,environment:{preset:$('env').value},weather:$('weather').value});$('status').textContent='480 x 270 | '+$('env').selectedOptions[0].textContent+' | '+Math.round(t)+' ms';}$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume motion':'Pause motion';};$('large').onchange=()=>c.classList.toggle('large',$('large').checked);$('smoke').onclick=()=>{const failures=[];let cases=0;for(const [id]of recipes)for(const weather of ['clear','rain','fog','blizzard']){try{scene.drawRace({time:9200,models,motion:true,environment:{preset:id},weather});cases++;}catch(e){failures.push({id,weather,error:String(e)});}}$('results').textContent=JSON.stringify({renderCases:cases,failures},null,2);draw();};function tick(now){if(!paused)t+=Math.min(40,last?now-last:0);last=now;draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);})();</script>
