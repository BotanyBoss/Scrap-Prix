<style>#fossil-test{position:fixed;inset:0;z-index:999999;background:#14272e;color:#f4e6c6;padding:20px;overflow:auto;font:16px system-ui}#fossil-test canvas{width:480px;height:270px;image-rendering:pixelated;display:block;margin-top:16px}#fossil-test canvas.large{width:960px;height:540px}#fossil-test button,#fossil-test select{padding:8px;margin:4px}#fossil-test p{margin:8px 0}</style>
<section id="fossil-test"><h1>Mechanical Fossil Test Drive</h1><p>Exact vehicle already fitted. This preview does not alter your run or save.</p><label>View <select id="ft-view"><option value="rear">Racing</option><option value="garage">Garage</option></select></label><label>Environment <select id="ft-env"><option value="city">City</option><option value="desert">Desert</option><option value="snow">Snow</option><option value="forest">Forest</option></select></label><label>Weather <select id="ft-weather"><option value="clear">Clear</option><option value="rain">Rain</option><option value="fog">Fog</option><option value="blizzard">Blizzard</option><option value="dust">Dust</option></select></label><br><button id="ft-pause">Pause</button><button id="ft-step">Step one frame</button><label>Speed <select id="ft-speed"><option value="1">Normal</option><option value="0.25">Slow motion</option><option value="2">Fast</option></select></label><label><input id="ft-large" type="checkbox"> 2x inspection size</label><label><input id="ft-rival" type="checkbox"> 70% isolated preview</label><canvas id="ft-canvas"></canvas><p id="ft-status">Loading artwork...</p></section>
<script>(async()=>{const $=id=>document.getElementById('ft-'+id),loadout={chassis:'needle-frame',engine:'reactor',tyres:'bone-wheels',gadget:'ram-plough'},models=ScrapVehicleArt.fromLoadout(loadout),scene=ScrapScene.create($('canvas'),{style:'chunky',camera:'rear',permanentFossil:true}),c=$('canvas');await scene.ready;let paused=false,t=0,last=0;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';};$('step').onclick=()=>{paused=true;t+=1000/60;$('pause').textContent='Resume';};$('large').onchange=()=>c.classList.toggle('large',$('large').checked);function frame(now){if(!paused)t+=Math.min(40,last?now-last:0)*Number($('speed').value);last=now;if($('view').value==='garage')scene.drawGarage(loadout);else{scene.drawRace({time:t,loadout,motion:true,environment:{preset:$('env').value},weather:$('weather').value});if($('rival').checked){const ctx=c.getContext('2d');ctx.save();ctx.setTransform(c.width/480,0,0,c.height/270,0,0);ctx.clearRect(125,140,230,130);ctx.fillStyle='#39444c';ctx.fillRect(125,140,230,130);ScrapVehicleArt.draw(ctx,{x:240,y:258,w:164*.7,h:113*.7,models,view:'rear',style:'chunky',comboBodywork:true,motion:true,time:t});ctx.restore();}}$('status').textContent='480 × 270 scene | player 164 × 113 | '+(paused?'paused':'running')+' | '+Math.round(t)+' ms';requestAnimationFrame(frame);}requestAnimationFrame(frame);})();</script>
